<!DOCTYPE html> <!-- abre o arquivo -->
<html lang="pt-br"> <!-- define que o documento está em HTML5 e que o idioma é português do Brasil -->

<head>
    <meta charset="UTF-8"> <!--  Define o padrao de codificação de caracteres (UTF-8) para suportar acentos e caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- garante que o site seja responsivo, ajustando-se a largura de tela -->
    <title>colmeia🐝</title> <!-- titulo de aba do navegador -->
    <link rel="stylesheet" href="style.css"> <!-- importa o arquivo externo de estilos css -->
</head>

<body>

  <!-- logo flutuante (movida para dentro do body, que é o correto) -->
  <div class="logo">
    <img src="abelhinha.png" alt="logo da colmeia">
  </div>

  <!-- saldo de moedas FDI (Favor de Interação) do usuário -->
  <div class="fdiBadge">🪙 <span id="fdiBalance">0</span> FDI</div>

  <!-- ======= animaçao de transição colmeia  ======= -->
  <!-- esta seção cria a tela de animaçao que parece sempre que o usuario troca de pagina( inicio, cadastro, cursos...). ela cobre toda a tela e exibe o gif de carregamento (colmeia_intr) -->
  <div id="animacaoTransicao">
    <img src="loading_gif.gif" alt="Carregando..." id="logoAnimada">
  </div>
  <!-- ======= fim da animação de transição ======= -->


  <!-- ======= animação da abelhinha guia ======= -->
  <div id="animacaoGuia" aria-hidden="false">
    <img id="abelha" src="abelha_guia.png" alt="Abelha guia">
    <div id="mensagem" role="status" aria-live="polite"></div>
  </div>


  <!-- conteudo principal da pagina -->
  <main>

    <div id="formContainer">
      <div class="campo" data-msg="Digite seu nome completo 🐝">
        <label>Nome:</label>
        <input type="text" id="nome">
      </div>

      <div class="campo" data-msg="agora seu CPF, por favor 🐝">
        <label>CPF:</label>
        <input type="text" id="cpf">
      </div>

      <div class="campo" data-msg="informe seu numero de telefone 🐝">
        <label>Numero:</label>
        <input type="tel" id="numero">
      </div>

      <div class="campo" data-msg="qual sua rua e numero da residencia? 🐝">
        <label>Rua:</label>
        <input type="text" id="rua">
      </div>

      <div class="campo" data-msg="agora sua cidade 🐝">
        <label>Cidade:</label>
        <input type="text" id="cidade">
      </div>

      <div class="campo" data-msg="Escolha sua area profissional 🐝">
        <label>area da profissão:</label>
        <select id="profissao">
          <option value="">selecione...</option>
          <option>programador</option>
          <option>arquiteto</option>
          <option>medico</option>
          <option>artista</option>
          <option>professor</option>
        </select>
      </div>

      <div class="campo" data-msg="por fim, diga suas capacidades e habilidades 🐝">
        <label>capacidades:</label>
        <textarea id="habilidades" rows="3" placeholder="soft skills, hardware, etc."></textarea>
      </div>

      <button id="btnProximo">Proximo</button>
    </div>
  </main>
  <!-- ======= fim da animação da abelhinha ======= -->


  <!-- botão que abre o menu lateral no modo celular -->
    <button id="cel-abrir">></button>

    <!-- Menu lateral (nav = area de navegação principal) -->
    <!-- A classe "fechado" indica que o menu começa escondido -->
    <nav id="aba-cel" class="fechado">
      <!-- Botão para fechar o menu -->
        <button id="cel-fechar">x</button>

        <ul>
          <li><a href="index.html" class="link-pagina">Início</a></li>
          <li><a href="cursos.html" class="link-pagina">cursos</a></li>
          <li><a href="cadastro.html" class="link-pagina">Cadastro</a></li>
        </ul>

    </nav>

    <!-- importa o arquivo JavaScript que controla a interação do menu -->
    <script src="script.js"></script>
</body>
</html>
